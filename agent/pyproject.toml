[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relaydesk-agent"
version = "0.1.0"
description = "RelayDesk local automation agent"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "watchdog>=4,<7", "httpx>=0.27,<1", "pydantic>=2.7,<3", "rich>=13,<15", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
relaydesk-agent = "relaydesk_agent.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
